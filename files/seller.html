<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seller - product management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="logo">Go_Commerce <span>/ Seller</span></div>
    <nav class="nav">
      <a href="manage-sellers.html">Manage sellers</a>
      <a href="manage-buyers.html">Manage buyers</a>
      <a href="seller.html" class="active">Seller page</a>
      <a href="buyer.html">Shop page</a>
    </nav>
  </header>

  <main class="container">
    <section class="card">
      <div class="card-head">
        <h1>My products</h1>
        <button class="btn">Add product</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Name</th><th>Price (NPR)</th><th>Stock</th><th>Actions</th></tr>
          </thead>
          <tbody>
            <tr><td>Product name 1</td><td>Price</td><td>Stock</td><td><a href="#">Edit</a> &nbsp; <a href="#" class="danger">Delete</a></td></tr>
            <tr><td>Product name 2</td><td>Price</td><td>Stock</td><td><a href="#">Edit</a> &nbsp; <a href="#" class="danger">Delete</a></td></tr>
            <tr><td>Product name 3</td><td>Price</td><td>Stock</td><td><a href="#">Edit</a> &nbsp; <a href="#" class="danger">Delete</a></td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>Add / edit product</h2>
      <form class="form">
        <label class="field">Name <input type="text" name="name"></label>
        <label class="field">Description <textarea name="description" rows="3"></textarea></label>
        <label class="field">Price (NPR) <input type="number" name="price" min="0"></label>
        <label class="field">Stock <input type="number" name="stock" min="0"></label>
        <div class="row">
          <button type="submit" class="btn">Save product</button>
          <button type="button" class="btn btn-outline">Cancel</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
