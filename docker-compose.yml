services:
  postgres:
    image: postgres:16
    container_name: gc-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-go_commerce}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - gc_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-go_commerce}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gc_pgdata:
